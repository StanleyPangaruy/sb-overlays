<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SB Overlays</title>
<link rel="stylesheet" href="/control.css">
</head>
<body>
<header>
  <h1>SB Overlays</h1>
  <span id="conn" class="conn">connecting…</span>
  <div class="spacer"></div>
  <button id="btn-show" class="btn big go">SHOW</button>
  <button id="btn-hide" class="btn big stop">HIDE</button>
</header>

<main>
  <section class="preview-wrap">
    <div class="preview" id="preview"><iframe id="preview-frame" src="/overlay?preview=1" title="Overlay preview"></iframe></div>
    <p class="hint">OBS: add a <b>Browser Source</b> → URL <code id="overlay-url"></code> → Width <b>1920</b>, Height <b>1080</b>.</p>
  </section>

  <div class="applybar" id="applybar">
    <span id="dirty-msg">All changes are on air.</span>
    <button id="btn-apply" class="btn primary" disabled>Apply changes <kbd>Ctrl+Enter</kbd></button>
    <button id="btn-revert" class="btn" disabled>Discard</button>
  </div>

  <div class="grid">
    <section class="card">
      <h2>Title bar</h2>
      <label>Live label <input data-k="liveLabel" placeholder="LIVE"></label>
      <label>Title <input data-k="title" placeholder="MAGNOLIA DISTRICT ASSEMBLY"></label>
      <div class="row">
        <label class="chk"><input type="checkbox" data-k="showClock"> Show clock</label>
        <label>Time zone <input data-k="timeZone" placeholder="Asia/Manila"></label>
      </div>
    </section>

    <section class="card">
      <h2>Ticker</h2>
      <label class="chk"><input type="checkbox" data-k="tickerVisible"> Show ticker</label>
      <label>Ticker items <small>(one per line)</small>
        <textarea data-k="tickerItems" rows="6"></textarea>
      </label>
      <div class="row">
        <label>Separator <input data-k="tickerSeparator" class="narrow"></label>
        <label>Speed <input type="range" min="30" max="300" step="5" data-k="tickerSpeed"> <span id="speed-val"></span> px/s</label>
      </div>
    </section>

    <section class="card wide">
      <h2>Facebook posts → ticker</h2>
      <p id="fb-status" class="muted"></p>
      <div class="row">
        <button id="fb-fetch" class="btn">Fetch latest posts</button>
        <label>Max characters per post <small>(stops at the last full sentence)</small> <input type="number" id="fb-max" value="200" min="40" max="1000" class="narrow"></label>
        <label class="chk"><input type="checkbox" id="fb-firstpara" checked> First paragraph only</label>
      </div>
      <ul id="fb-list" class="fb-list"></ul>
      <div class="row" id="fb-actions" hidden>
        <button id="fb-add" class="btn">Add selected to ticker</button>
        <button id="fb-replace" class="btn">Replace ticker with selected</button>
        <span class="muted">Then review the ticker items and press Apply.</span>
      </div>
    </section>

    <section class="card">
      <h2>Social strip</h2>
      <label class="chk"><input type="checkbox" data-k="showSocial"> Show social strip</label>
      <label>Website <input data-k="social.website"></label>
      <label>YouTube <input data-k="social.youtube"></label>
      <label>Facebook <input data-k="social.facebook"></label>
      <label>Instagram <input data-k="social.instagram"></label>
    </section>

    <section class="card">
      <h2>Look</h2>
      <div class="row">
        <label>Bar <input type="color" data-k="colors.bar"></label>
        <label>Ticker <input type="color" data-k="colors.ticker"></label>
        <label>Clock <input type="color" data-k="colors.clock"></label>
      </div>
      <label>Logo <small>(PNG with transparent background works best)</small>
        <input type="file" id="logo-file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
      </label>
      <button id="btn-reset" class="btn danger-outline">Reset all to defaults</button>
    </section>
  </div>
</main>
<script src="/control.js"></script>
</body>
</html>
