<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>SB Overlays – Lower Third</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body data-mode="static">
  <div id="stage">
    <div id="lt" class="lt hidden">
      <div class="social" id="social">
        <span class="s-item" id="s-website"><svg viewBox="0 0 24 24" class="ic ic-web"><circle cx="12" cy="12" r="10" fill="#1d6fd8"/><path d="M2 12h20M12 2c3 3 3 17 0 20M12 2c-3 3-3 17 0 20" stroke="#fff" stroke-width="1.6" fill="none"/></svg><span class="t"></span></span>
        <span class="s-item" id="s-youtube"><svg viewBox="0 0 24 24" class="ic"><rect x="1" y="4" width="22" height="16" rx="4.5" fill="#ff0000"/><path d="M10 8.5v7l6-3.5z" fill="#fff"/></svg><span class="t"></span></span>
        <span class="s-item" id="s-facebook"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="11" fill="#1877f2"/><path d="M13.2 21v-7h2.4l.4-2.8h-2.8V9.4c0-.8.3-1.4 1.4-1.4h1.5V5.5c-.3 0-1.2-.1-2.2-.1-2.2 0-3.6 1.3-3.6 3.7v2.1H7.9V14h2.4v7z" fill="#fff"/></svg><span class="t"></span></span>
        <span class="s-item" id="s-instagram"><svg viewBox="0 0 24 24" class="ic"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".6" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig)"/><circle cx="12" cy="12" r="4.3" stroke="#fff" stroke-width="2" fill="none"/><circle cx="17.3" cy="6.7" r="1.3" fill="#fff"/></svg><span class="t"></span></span>
      </div>

      <div class="bar" id="bar">
        <div class="bar-text"><span id="live"></span><span class="pipe" id="pipe">|</span><span id="title"></span></div>
      </div>

      <div class="clock" id="clock"><span id="clock-text">--:-- --</span></div>

      <div class="ticker" id="ticker">
        <div class="ticker-track" id="ticker-track"></div>
      </div>

      <div class="logo" id="logo"><img id="logo-img" alt=""></div>
    </div>
    <div class="corner off" id="corner"><div class="corner-card" id="corner-card"><img id="corner-img" alt=""></div></div>
  </div>
<script src="overlay.js"></script>
</body>
</html>
